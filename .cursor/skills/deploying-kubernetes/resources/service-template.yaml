# Service Template para Kubernetes
# Reemplazar variables {{...}} antes de aplicar
#
# Uso: kubectl apply -f service.yaml -n {{NAMESPACE}}

---
# ClusterIP Service (acceso interno)
apiVersion: v1
kind: Service
metadata:
  name: {{APP_NAME}}-service
  namespace: {{NAMESPACE}}
  labels:
    app: {{APP_NAME}}
spec:
  type: ClusterIP
  selector:
    app: {{APP_NAME}}
  ports:
  - name: http
    port: 80
    targetPort: {{PORT}}
    protocol: TCP

