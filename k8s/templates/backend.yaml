apiVersion: v1
kind: Service
metadata:
  name: __APP_NAME__-backend
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: __APP_NAME__
    app.kubernetes.io/component: backend
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: __APP_NAME__
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: __NODE_PORT__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: __APP_NAME__-backend
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: __APP_NAME__
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: __APP_NAME__
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: __APP_NAME__
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: __BACKEND_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: __BACKEND_PORT__
          envFrom:
            - secretRef:
                name: __APP_NAME__-env
          env:
            # Ensure the backend uses the in-cluster Postgres service hostname.
            - name: DB_HOST
              value: postgres
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
